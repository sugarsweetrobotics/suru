# Read the Docs の設定(#209)。ビルドのたびに標準ライブラリの API のページを作ってから Sphinx を動かします
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python suru.py --文書 --出力 docs/api lib

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
