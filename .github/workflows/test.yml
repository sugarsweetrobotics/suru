# 「する」本体の試験: PR のたびと main への push で動きます(#193)。
#   1. Go 版: go vet と go test
#   2. Python 版: pytest(全部)。Go 版と同じ IR とエラーを出すかも、ここで確かめます
#   3. Windows(MSYS2 UCRT64): 共有ライブラリ(.dll)の試験(#208 段階5)
# lib/ の する で書いた試験(suru --試験 lib/)は、言語の仕様が落ち着くまで CI では流しません(#230)
# pytest は4つに分けて並べて流します(1つにすると30分を超えます)
name: 試験

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          test -z "$(gofmt -l compiler cmd)" || { gofmt -l compiler cmd; echo "gofmt で整えてください"; exit 1; }
          go vet ./...
          go test ./...

  python:
    name: Python 版(${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Go 版と同じ IR を出すかの試験は長いので1つにし、残りのファイルを3つに分けて並べて流す
        part: ["Go 版とそろうか", "1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pytest
        env:
          PART: ${{ matrix.part }}
        run: |
          pip install pytest pytest-timeout
          if [ "$PART" = "Go 版とそろうか" ]; then
            files=tests/test_go_compiler.py
          else
            k=${PART%/*}
            files=$(ls tests/test_*.py | grep -v test_go_compiler.py | awk -v k="$k" 'NR % 3 == k % 3')
          fi
          # 止まったままの試験があれば、名前とスタックを出して止める
          python3 -m pytest -v --timeout=600 --durations=10 $files

  windows:
    name: Windows の共有ライブラリ
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # 改行を LF のまま取り出す
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pytest
      - name: pytest
        env:
          PYTHONUTF8: "1"
          CC: clang
        run: |
          go test ./cmd/kumu -run TestSharedLibProject
          python -m pytest -v --durations=10 tests/test_shared_lib.py
