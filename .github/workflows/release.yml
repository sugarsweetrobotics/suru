# 「する」本体のリリース: v0.1.0 のようなタグを push すると動きます。
#   1. 版がそろっているか調べて、テストする
#   2. PyPI 用の wheel と sdist、OS ごとの suruc・suru-ls・kumu を作る
#   3. GitHub Releases に置く
#   4. PyPI に公開する(Trusted Publishing。トークンは要りません)
#   5. Homebrew の tap(リポジトリの持ち主の homebrew-suru)の formula を新しくする
# 持ち主やリポジトリの名前はここに書かず、GitHub から受け取ります(organization に移しても直さなくてよい)。
# 手で動かす(workflow_dispatch)ときは、ふだんは 1 と 2 だけを行い、何も公開しません。
# 「公開する」に印を付けて main で動かすと、suru.py の版でタグ v版 を作って 3〜5 まで行います
# (スマホの GitHub からでも公開できるように)。
# 準備と手順は docs/リリース.md にあります。
name: リリース

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "公開する(main のときだけ。suru.py の版でタグを作る)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: 版とテスト
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: version
        name: 版を調べる
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag="v$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("suru.py", encoding="utf-8").read()).group(1))')"
            publish=false
            if [ "$PUBLISH" = true ]; then
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "公開は main で動かしたときだけです(今は $GITHUB_REF_NAME)"
                exit 1
              fi
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                echo "タグ $tag はもうあります。suru.py と Go 版の版を上げてから動かしてください"
                exit 1
              fi
              publish=true
            fi
          fi
          python3 packaging/check_version.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "版 ${tag#v}(公開する: $publish)" >> "$GITHUB_STEP_SUMMARY"
      - name: テスト
        run: |
          pip install pytest
          python3 -m pytest -q tests/test_suru.py tests/test_check.py tests/test_compile.py tests/test_go_compiler.py
          go test ./...

  python:
    name: wheel と sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install build twine
          python3 -m build
          python3 -m twine check dist/*
          pip install dist/*.whl
          cd /tmp && suru --version
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  binaries:
    name: suruc と suru-ls
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: packaging/build_binaries.sh "${{ needs.check.outputs.version }}" bin
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  # Linux で作ったものを macOS で動かして確かめる
  smoke-macos:
    name: macOS で動かす
    needs: [check, binaries]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - run: |
          tar -xzf suru-*-darwin-arm64.tar.gz
          cd suru-*-darwin-arm64
          ./suruc --version
          ./suru-ls --version
          printf '1 と 2 を 加算する\n' > t.suru
          ./suruc t.suru && ./t

  release:
    name: GitHub Releases
    if: needs.check.outputs.publish == 'true'
    needs: [check, python, binaries, smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手で動かしたときは、ここでタグも作る(--target のコミットに付く)
          gh release create "${{ needs.check.outputs.tag }}" assets/* --target "$GITHUB_SHA" \
            --title "する ${{ needs.check.outputs.version }}" \
            --notes "$(sed "s|__REPO__|$GITHUB_REPOSITORY|g; s|__OWNER__|$GITHUB_REPOSITORY_OWNER|g" packaging/release_notes.md)"

  pypi:
    name: PyPI に公開
    if: needs.check.outputs.publish == 'true'
    needs: [check, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/suru-lang/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    name: Homebrew の tap
    if: needs.check.outputs.publish == 'true'
    needs: [check, release]
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/checkout@v4
      - name: formula を作る
        run: |
          version="${{ needs.check.outputs.version }}"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${version}.tar.gz" -o src.tar.gz
          sha=$(sha256sum src.tar.gz | cut -d' ' -f1)
          python3 packaging/homebrew/make_formula.py --repo "$GITHUB_REPOSITORY" "$version" "$sha" > suru.rb
          { echo '```ruby'; cat suru.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: tap に push する
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN がないので、tap は新しくしません(formula はこの実行のまとめにあります)"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-suru.git" tap
          mkdir -p tap/Formula
          cp suru.rb tap/Formula/suru.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/suru.rb
          git commit -m "suru ${{ needs.check.outputs.version }}"
          git push
