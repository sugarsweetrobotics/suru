[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "suru-lang"
dynamic = ["version"]
description = "日本語の関数型プログラミング言語「する」(インタプリタ・型検査・LLVM コンパイラ)"
readme = "README.md"
requires-python = ">=3.10"
# 本体は GPL、コンパイルしたプログラムに入る実行時ライブラリ(runtime/)と標準ライブラリ(lib/)は MIT
license = "GPL-3.0-or-later AND MIT"
license-files = ["LICENSE", "lib/LICENSE", "runtime/LICENSE"]
authors = [{ name = "sugarsweetrobotics" }]
keywords = ["japanese", "programming-language", "interpreter", "compiler", "llvm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Natural Language :: Japanese",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/sugarsweetrobotics/suru"
Repository = "https://github.com/sugarsweetrobotics/suru"
Issues = "https://github.com/sugarsweetrobotics/suru/issues"

[project.scripts]
suru = "suru:cli"

[tool.hatch.version]
path = "suru.py"

# 3つのモジュールはそのまま site-packages に置き、lib/ と runtime/ は suru_data/ の中に入れる
[tool.hatch.build.targets.wheel]
only-include = ["suru.py", "suru_check.py", "suru_compile.py"]

[tool.hatch.build.targets.wheel.force-include]
"lib" = "suru_data/lib"
"runtime" = "suru_data/runtime"

[tool.hatch.build.targets.sdist]
include = ["suru.py", "suru_check.py", "suru_compile.py", "lib/", "runtime/", "examples/", "tests/", "README.md", "LICENSE"]
