# Read the Docs の設定(kumu 文書 --雛形 が書いたもの)
# ビルドのたびに kumu を取ってきて、docs/api に API のページを作ってから Sphinx を動かします。
# 下の URL の kumu の版({{kumu の版}})は、ライブラリを新しい する に上げるとき、CI の版と一緒に上げます。
# The kumu version in the URL below ({{kumu の版}}) is bumped together with CI when the library moves to a new Suru.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - curl -sSfL https://github.com/suru-lang/suru/releases/download/v{{kumu の版}}/suru-{{kumu の版}}-linux-amd64.tar.gz | tar -xz -C /tmp
      - /tmp/suru-{{kumu の版}}-linux-amd64/kumu 文書 --出力 docs/api

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
